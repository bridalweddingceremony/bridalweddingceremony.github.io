<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আপনার ছবি</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2b2320;--mute:#7a6d66;--line:#e6dcd3;--accent:#8c3b4a;--ok:#2f7d4f;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#1d1917;--card:#2a2421;--ink:#f3ebe5;--mute:#b4a69d;--line:#443b36;--accent:#e08a9a;--ok:#6fcf97;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Noto Serif Bengali",serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:1.8rem;margin:.2em 0 .2em}
p.lead{color:var(--mute);margin:0 0 1em}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
button{font:inherit;padding:11px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;max-width:420px;margin:0 auto}
video{width:100%;display:block;transform:scaleX(-1)}
.people{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.person{position:relative;width:72px;height:72px}
.person img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid var(--accent)}
.person b{position:absolute;top:-6px;right:-6px;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;background:var(--err);color:#fff;cursor:pointer;font-size:.9rem}
.msg{margin-top:10px;font-size:.95rem}.err{color:var(--err)}.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--line);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tick{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid var(--accent);display:none;color:var(--accent);text-align:center;line-height:20px;font-weight:700}
.ph.sel .tick{display:block;background:var(--accent);color:#fff}
.ph.sel{outline:3px solid var(--accent);outline-offset:-3px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
.hide{display:none}
.small{font-size:.85rem;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1 id="title">আপনার ছবি</h1>
<p class="lead" id="lead">নিজের মুখ স্ক্যান করুন, শুধু আপনার ছবিগুলো পেয়ে যাবেন।</p>

<section id="scanBox" class="hide">
  <div class="cam hide" id="camWrap"><video id="vid" playsinline muted></video></div>
  <div class="row">
    <button id="camBtn">ক্যামেরা চালু করুন</button>
    <button id="snapBtn" class="hide">মুখ স্ক্যান করুন</button>
  </div>
  <div id="scanMsg" class="msg"></div>
  <div class="people" id="people"></div>
  <p class="small hide" id="famHint">পরিবারের আরও কেউ থাকলে একে একে ক্যামেরার সামনে এনে আবার "মুখ স্ক্যান করুন" চাপুন।</p>
  <div class="row"><button id="findBtn" class="hide">আমাদের ছবি খুঁজুন</button></div>
</section>

<section id="results" class="hide">
  <div id="resMsg" class="msg"></div>
  <div class="row">
    <button id="dlBtn">ZIP করে নামান</button>
    <button id="saveBtn" class="ghost hide">ফোনের গ্যালারিতে সেভ</button>
    <button id="selAll" class="ghost">সব বাছুন</button>
  </div>
  <div class="bar hide" id="barWrap"><i id="bar"></i></div>
  <div class="small" id="dlMsg"></div>
  <div class="grid" id="grid"></div>
</section>

<p class="small">আপনার মুখের তথ্য শুধু আপনার ফোনেই মেলানো হয়, কোথাও জমা হয় না।</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const SUPABASE_URL="https://fudettgamzstrmoidaso.supabase.co";
const SUPABASE_KEY="sb_publishable_CIXDLu4BXsCocGeHCFYp8Q_s3nxH4xv";
const MODEL_URL="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";
const THRESHOLD=0.5; // ছোট = কড়া মিল
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let ev=null, photos=[], people=[], matched=[], selected=new Set(), stream=null, modelsP=null;

function loadModels(){
  if(!modelsP) modelsP=Promise.all([
    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)]);
  return modelsP;
}
const pubUrl=p=>sb.storage.from("photos").getPublicUrl(p).data.publicUrl;
const dist=(a,b)=>{let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)};

async function init(){
  const slug=new URLSearchParams(location.search).get("event");
  if(!slug){ $("lead").textContent="গ্যালারি খুলতে অনুষ্ঠানের QR কোড স্ক্যান করে আসুন।"; return; }
  const {data,error}=await sb.from("events").select("id,name").eq("slug",slug).maybeSingle();
  if(error||!data){ $("lead").textContent="এই অনুষ্ঠানের গ্যালারি পাওয়া যায়নি। QR কোড বা লিংকটা আবার দেখুন।"; return; }
  ev=data; $("title").textContent=ev.name; document.title=ev.name;
  $("scanBox").classList.remove("hide");
  loadModels();
}

$("camBtn").onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
    $("vid").srcObject=stream; await $("vid").play();
    $("camWrap").classList.remove("hide"); $("snapBtn").classList.remove("hide"); $("camBtn").classList.add("hide");
    $("scanMsg").textContent="মুখ ক্যামেরার সামনে রাখুন, তারপর স্ক্যান করুন।"; $("scanMsg").className="msg";
  }catch(e){ $("scanMsg").className="msg err"; $("scanMsg").textContent="ক্যামেরা চালু করা যায়নি। ব্রাউজারে ক্যামেরার অনুমতি দিন।"; }
};

$("snapBtn").onclick=async()=>{
  const b=$("snapBtn"), m=$("scanMsg"); b.disabled=true; m.className="msg"; m.textContent="মুখ খোঁজা হচ্ছে...";
  try{
    await loadModels();
    const v=$("vid"), c=document.createElement("canvas");
    c.width=v.videoWidth; c.height=v.videoHeight; c.getContext("2d").drawImage(v,0,0);
    const res=await faceapi.detectAllFaces(c,new faceapi.SsdMobilenetv1Options({minConfidence:0.6})).withFaceLandmarks().withFaceDescriptors();
    if(!res.length){ m.className="msg err"; m.textContent="মুখ পাওয়া যায়নি। আলোর দিকে মুখ করে আবার চেষ্টা করুন।"; }
    else{
      const r=res.sort((a,b)=>b.detection.box.area-a.detection.box.area)[0];
      const bx=r.detection.box, t=document.createElement("canvas"); t.width=t.height=96;
      const side=Math.max(bx.width,bx.height)*1.3, cx=bx.x+bx.width/2, cy=bx.y+bx.height/2;
      t.getContext("2d").drawImage(c,cx-side/2,cy-side/2,side,side,0,0,96,96);
      people.push({desc:Array.from(r.descriptor),thumb:t.toDataURL("image/jpeg",.7)});
      renderPeople(); m.className="msg ok";
      m.textContent=res.length>1?"একাধিক মুখ ছিল, সবচেয়ে বড় মুখটা নেওয়া হয়েছে।":"মুখ স্ক্যান হয়েছে।";
    }
  }catch(e){ m.className="msg err"; m.textContent="সমস্যা হয়েছে: "+(e.message||e); }
  b.disabled=false;
};

function renderPeople(){
  $("people").innerHTML="";
  people.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="person";
    d.innerHTML=`<img src="${p.thumb}" alt="স্ক্যান করা মুখ"><b title="সরান" role="button" tabindex="0">×</b>`;
    d.querySelector("b").onclick=()=>{people.splice(i,1);renderPeople()};
    $("people").appendChild(d);
  });
  $("findBtn").classList.toggle("hide",!people.length);
  $("famHint").classList.toggle("hide",!people.length);
}

async function fetchPhotos(){
  if(photos.length) return;
  let from=0;
  while(true){
    const {data,error}=await sb.from("photos").select("id,file_path,face_descriptors").eq("event_id",ev.id).range(from,from+999);
    if(error) throw error;
    photos=photos.concat(data); if(data.length<1000) break; from+=1000;
  }
}

$("findBtn").onclick=async()=>{
  const b=$("findBtn"); b.disabled=true; $("scanMsg").className="msg"; $("scanMsg").textContent="ছবি খোঁজা হচ্ছে...";
  try{
    await fetchPhotos();
    matched=photos.filter(ph=>(ph.face_descriptors||[]).some(d=>people.some(p=>dist(d,p.desc)<THRESHOLD)));
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    $("camWrap").classList.add("hide"); $("snapBtn").classList.add("hide"); $("camBtn").classList.remove("hide");
    $("camBtn").textContent="আরও মুখ যোগ করুন";
    showResults(); $("scanMsg").textContent="";
  }catch(e){ $("scanMsg").className="msg err"; $("scanMsg").textContent="সমস্যা হয়েছে: "+(e.message||e); }
  b.disabled=false;
};

function showResults(){
  $("results").classList.remove("hide"); selected=new Set();
  const g=$("grid"); g.innerHTML="";
  if(!matched.length){ $("resMsg").textContent="কোনো ছবি মেলেনি। আলো ভালো জায়গায় আবার স্ক্যান করুন, অথবা ফটোগ্রাফারকে জানান।"; updateBtns(); return; }
  $("resMsg").textContent=`${matched.length}টি ছবি পাওয়া গেছে। ছবিতে চাপ দিয়ে বাছাই করুন, না বাছলে সবগুলো নামবে।`;
  matched.forEach(ph=>{
    const d=document.createElement("div"); d.className="ph";
    d.innerHTML=`<img loading="lazy" src="${pubUrl(ph.file_path)}" alt="আপনার ছবি"><span class="tick">✓</span>`;
    d.onclick=()=>{selected.has(ph.id)?selected.delete(ph.id):selected.add(ph.id);d.classList.toggle("sel");updateBtns()};
    g.appendChild(d);
  });
  updateBtns();
  $("results").scrollIntoView({behavior:"smooth"});
}
const target=()=>selected.size?matched.filter(p=>selected.has(p.id)):matched;
function updateBtns(){
  const n=target().length;
  $("dlBtn").textContent=selected.size?`বাছাই করা ${n}টি ZIP করে নামান`:`সব ${n}টি ZIP করে নামান`;
  $("dlBtn").disabled=!n;
  $("selAll").textContent=selected.size===matched.length?"বাছাই বাতিল":"সব বাছুন";
  const canShare=navigator.canShare&&navigator.canShare({files:[new File([""],"a.jpg",{type:"image/jpeg"})]});
  $("saveBtn").classList.toggle("hide",!canShare||!n);
}
$("selAll").onclick=()=>{
  const all=selected.size===matched.length; selected=new Set(all?[]:matched.map(p=>p.id));
  [...$("grid").children].forEach(el=>el.classList.toggle("sel",!all)); updateBtns();
};

async function getBlob(ph){ const r=await fetch(pubUrl(ph.file_path)); if(!r.ok) throw new Error("ডাউনলোড ব্যর্থ"); return r.blob(); }
const extOf=p=>p.split(".").pop();

$("dlBtn").onclick=async()=>{
  const list=target(); const b=$("dlBtn"); b.disabled=true; $("barWrap").classList.remove("hide"); $("bar").style.width="0";
  try{
    const zip=new JSZip(); let n=0;
    for(const ph of list){
      zip.file(`photo-${String(++n).padStart(3,"0")}.${extOf(ph.file_path)}`,await getBlob(ph));
      $("bar").style.width=(n/list.length*90)+"%"; $("dlMsg").textContent=`${n}/${list.length} ছবি নেওয়া হয়েছে...`;
    }
    const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=(ev.name||"photos")+".zip";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    $("bar").style.width="100%"; $("dlMsg").textContent="ডাউনলোড শুরু হয়েছে।";
  }catch(e){ $("dlMsg").textContent="সমস্যা হয়েছে: "+(e.message||e); }
  b.disabled=false; updateBtns();
};

// ফোনের গ্যালারিতে সেভ (শেয়ার মেনু দিয়ে, ১০টি করে)
$("saveBtn").onclick=async()=>{
  const list=target(); $("dlMsg").textContent="প্রস্তুত হচ্ছে...";
  try{
    for(let i=0;i<list.length;i+=10){
      const files=[]; 
      for(const ph of list.slice(i,i+10)){ const bl=await getBlob(ph); files.push(new File([bl],`photo-${i+files.length+1}.${extOf(ph.file_path)}`,{type:bl.type||"image/jpeg"})); }
      await navigator.share({files}); 
    }
    $("dlMsg").textContent="";
  }catch(e){ $("dlMsg").textContent=e.name==="AbortError"?"":"সেভ করা যায়নি, ZIP ডাউনলোড ব্যবহার করুন।"; }
};

init();
</script>
</body>
</html>
